<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Registro Visite Is Mellus</title>
<meta name="theme-color" content="#6b2d5c">
<meta name="app-version" content="2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registro Visite">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: una colonna su telefono e tablet verticale; lista + dettaglio affiancati da 900px */
:root{
  --bg:#f6f5f8; --surface:#ffffff; --sunk:#eeecf2; --line:#dcd8e3;
  --fg:#1f1b26; --muted:#6a6475;
  --accent:#6b2d5c; --accent-fg:#ffffff; --accent-soft:#f1e6ef;
  --si:#1f7a4d; --si-bg:#e3f3ea; --no:#b3261e; --no-bg:#fbe7e5; --bss:#b85c00; --bss-bg:#fdeedd; --nd:#6a6475; --nd-bg:#eeecf2;
  --f-display:"Avenir Next","Segoe UI Variable Display","Segoe UI",Roboto,system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16131b; --surface:#1f1b26; --sunk:#2a2532; --line:#3a3444; --fg:#ece8f1; --muted:#a39cad;
  --accent:#d38fc1; --accent-fg:#1f1b26; --accent-soft:#3a2536;
  --si:#6fd3a0; --si-bg:#16362a; --no:#ff8a80; --no-bg:#3d1c1a; --bss:#ffb35c; --bss-bg:#3b2810; --nd:#a39cad; --nd-bg:#2a2532; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16131b; --surface:#1f1b26; --sunk:#2a2532; --line:#3a3444; --fg:#ece8f1; --muted:#a39cad;
  --accent:#d38fc1; --accent-fg:#1f1b26; --accent-soft:#3a2536;
  --si:#6fd3a0; --si-bg:#16362a; --no:#ff8a80; --no-bg:#3d1c1a; --bss:#ffb35c; --bss-bg:#3b2810; --nd:#a39cad; --nd-bg:#2a2532; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:10px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--muted);letter-spacing:0}
.syncbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.net{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.net.on{color:var(--si);background:var(--si-bg)} .net.off{color:var(--no);background:var(--no-bg)}
.queue{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.queue.pend{border-color:var(--bss);color:var(--bss);background:var(--bss-bg);font-weight:600}
.last{font-size:12px;color:var(--muted)}
.msg{border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.msg.ok{background:var(--si-bg);color:var(--si)} .msg.err{background:var(--no-bg);color:var(--no)} .msg.info{background:var(--sunk);color:var(--fg)} .msg.warn{background:var(--bss-bg);color:var(--bss)}
.grid{display:grid;gap:16px}
@media (min-width:900px){.grid{grid-template-columns:300px minmax(0,1fr);align-items:start}
  .pane-list{position:sticky;top:10px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
  .back{display:none!important}}
@media (min-width:1100px){.grid{grid-template-columns:340px minmax(0,1fr)}}
.grid.setup-mode{grid-template-columns:minmax(0,1fr)!important}
@media (max-width:899px){.grid.has-detail .pane-list{display:none}.grid:not(.has-detail) .pane-main{display:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pane-list{padding:12px;gap:10px;display:flex;flex-direction:column;min-width:0}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-align:center}
.btn:hover{background:var(--sunk)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--no);border-color:var(--no)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{font-size:12px;color:var(--muted)}
ul.list{list-style:none;margin:0;padding:0;overflow:auto;min-height:0}
ul.list li button{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 8px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;border-radius:0}
ul.list li button:hover{background:var(--sunk)}
ul.list li button[aria-current="true"]{background:var(--accent-soft)}
.cname{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csub{grid-column:1/-1;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-SI{color:var(--si);background:var(--si-bg)} .p-NO{color:var(--no);background:var(--no-bg)} .p-BSS{color:var(--bss);background:var(--bss-bg)} .p-nd{color:var(--nd);background:var(--nd-bg)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bss);border:1px solid var(--bss);border-radius:4px;padding:0 4px;margin-left:6px;white-space:nowrap}
.tag.err{color:var(--no);border-color:var(--no)}
.pane-main{min-width:0;padding:18px;display:flex;flex-direction:column;gap:18px}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{background:var(--sunk);border-radius:8px;padding:10px}
.st>span:first-child{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.next{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.when{font-family:var(--f-mono);font-size:13px}
.late{color:var(--no);font-weight:600}
.note{background:var(--sunk);border-radius:8px;padding:12px;font-size:14px;white-space:pre-wrap}
.two{display:grid;gap:18px}
@media (min-width:640px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.contacts{display:flex;flex-direction:column;gap:6px;font-size:14px}
.contacts span{color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{border-left:2px solid var(--line);padding:2px 0 2px 12px}
.tl li.pend{border-left-color:var(--bss)}
.t-d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.t-x{font-size:14px;white-space:pre-wrap}
.empty{color:var(--muted);font-size:14px}
.back{align-self:flex-start}
form{display:flex;flex-direction:column;gap:20px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-family:var(--f-display);font-weight:600;font-size:17px;margin-bottom:10px;padding:0}
.row{display:grid;gap:12px}
@media (min-width:560px){.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label .req{color:var(--no)}
input[type=text],input[type=date],input[type=number],input[type=url],input[type=password],select,textarea{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:16px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;border:0;background:var(--bg);cursor:pointer;font-size:13.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{font-weight:600}
.seg button[aria-pressed="true"][data-v="SI"]{background:var(--si-bg);color:var(--si)}
.seg button[aria-pressed="true"][data-v="NO"]{background:var(--no-bg);color:var(--no)}
.seg button[aria-pressed="true"][data-v="BSS"]{background:var(--bss-bg);color:var(--bss)}
.rep{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative}
.rep .x{position:absolute;top:4px;right:4px}
.disc{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:22px}
.fbrow{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-block:8px;font-size:14px}
@media (max-width:480px){.fbrow{grid-template-columns:1fr}}
.actions{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);padding-block:12px 4px;border-top:1px solid var(--line)}
.actions .btn{flex:1}
.err{color:var(--no);font-size:13.5px;margin:0}
.warn{background:var(--bss-bg);color:var(--bss);border-radius:8px;padding:10px 12px;font-size:13.5px}
.qitem{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.qitem .t-x{flex:1;min-width:0}
.setup{max-width:520px;margin:24px auto}
.setup p{color:var(--muted);margin:.4em 0}
.welcome{color:var(--muted)} .welcome p{max-width:60ch}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:1px 4px;border-radius:4px;word-break:break-all}

/* v2: logo, navigazione, dashboard, storico, quotazioni */
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:inherit}
.brand>span{display:block}
.logo{height:46px;width:auto;background:#fff;border-radius:8px;padding:3px;border:1px solid var(--line)}
.logo-big{display:block;height:110px;width:auto;margin:0 auto 14px;background:#fff;border-radius:12px;padding:6px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px;font-weight:600;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
@media (min-width:900px){.tabs [data-nav=list]{display:none}.tabs{max-width:420px}}
.navrow{display:flex;gap:4px;flex-wrap:wrap;align-self:flex-start}
.dash-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.d-actions{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:12px;text-align:left;font:inherit;color:inherit}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--line)}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.alert b{color:var(--no)}
.dgrid{display:grid;gap:18px}
@media (min-width:900px){.dgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.dgrid section{min-width:0}
ul.dl{list-style:none;margin:0;padding:0}
.rlink{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;font:inherit;color:inherit}
.rlink:hover{background:var(--sunk)}
.rlink .when{font-size:12.5px;white-space:nowrap}
section h2{margin-bottom:8px}
.vlist{display:flex;flex-direction:column;gap:12px}
.vcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.vcard.pend{border-left:3px solid var(--bss)}
.vhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vwho{font-size:14px}
.vsub h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 4px;font-weight:600}
.vnext{font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.qt{width:100%;border-collapse:collapse;font-size:13px}
.qt th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.qt td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.qt .num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.btn.small{padding:5px 9px;font-size:12.5px}
.qgroup{margin-bottom:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.qrow{display:grid;grid-template-columns:22px minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 62px 34px;gap:8px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:8px}
.qn{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-bottom:12px}
.qrow .disc{padding:0 0 12px;text-align:right}
.qrow .x2{padding:8px 4px;margin-bottom:4px}
@media (max-width:820px){.qrow{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 34px}
  .qrow label:nth-of-type(1){grid-column:2/4}.qrow .x2{grid-column:4;grid-row:1}
  .qrow label:nth-of-type(2){grid-column:2}.qrow label:nth-of-type(3){grid-column:3}
  .qrow label:nth-of-type(4){grid-column:2}.qrow label:nth-of-type(5){grid-column:3}.qrow .disc{grid-column:2/4;text-align:left;padding:0}}
details.qdet{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
details.qdet summary{cursor:pointer;font-size:13px;font-weight:600;list-style-position:inside}
details.qdet[open] summary{margin-bottom:6px}
.vsub h3 .pill,.qdet summary .pill{vertical-align:middle}
.qgroup h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px;font-weight:600}
.qgroup .btn.small,.vsub>.btn.small{margin-top:6px}
label.check{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--fg)}
label.check input{width:20px;height:20px}

/* calendario */
.calmese{font-family:var(--f-display);font-size:18px;text-transform:capitalize;letter-spacing:0;color:var(--fg);margin:0}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid>span{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cday{min-height:72px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;font:inherit;color:inherit;text-align:left;min-width:0}
.cday:hover{background:var(--sunk)}
.cday.out{opacity:.45}
.cday.today .n{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 6px}
.cday[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.cday .n{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.badge{font-size:11px;border-radius:999px;padding:0 6px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.badge i{font-style:normal}
.b-f{background:var(--accent-soft);color:var(--accent)} .b-l{background:var(--no-bg);color:var(--no)} .b-v{background:var(--si-bg);color:var(--si)}
.legenda{display:flex;gap:8px;flex-wrap:wrap}
h3.sub{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 2px;font-weight:600}
.linkmsg{display:block;width:100%;text-align:left;border:0;cursor:pointer;font:inherit}
@media (max-width:640px){.cday{min-height:52px;padding:3px 4px}.badge i{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="brandBtn" type="button" aria-label="Torna alla dashboard"><img src="logo.png" alt="Is Mellus" class="logo"><span>Registro Visite<small id="opLine">Is Mellus · Sales Dubai</small></span></button>
    <div class="syncbar" id="syncbar" hidden>
      <span class="net" id="net"></span>
      <button class="queue" id="queueBtn" type="button"></button>
      <button class="btn primary" id="syncBtn" type="button">Sincronizza</button>
      <span class="last" id="last"></span>
    </div>
  </header>
  <nav class="tabs" id="tabs" hidden aria-label="Sezioni">
    <button type="button" data-nav="dash">Dashboard</button>
    <button type="button" data-nav="list">Clienti</button>
    <button type="button" data-nav="cal">Calendario</button>
  </nav>
  <div id="flash"></div>
  <div class="grid" id="grid">
    <aside class="panel pane-list" id="paneList" aria-label="Clienti">
      <div class="search">
        <input type="text" id="q" placeholder="Cerca cliente o contatto…" autocomplete="off" aria-label="Cerca cliente">
        <button class="btn primary" type="button" id="newBtn">+ Nuovo</button>
      </div>
      <div class="chips" role="group" aria-label="Filtri">
        <button class="chip" data-f="all" aria-pressed="true" type="button">Tutti</button>
        <button class="chip" data-f="mine" aria-pressed="false" type="button">I miei</button>
        <button class="chip" data-f="late" aria-pressed="false" type="button">Follow-up scaduti</button>
        <button class="chip" data-f="soon" aria-pressed="false" type="button">Prossimi 7 gg</button>
        <button class="chip" data-f="quot" aria-pressed="false" type="button">Quotazioni in attesa</button>
        <button class="chip" data-f="SI" aria-pressed="false" type="button">Account SI</button>
        <button class="chip" data-f="BSS" aria-pressed="false" type="button">BSS</button>
        <button class="chip" data-f="NO" aria-pressed="false" type="button">Account NO</button>
      </div>
      <div class="count" id="count"></div>
      <ul class="list" id="list"></ul>
    </aside>
    <main class="panel pane-main" id="main"></main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
